[project]
name = "timesfm-serve"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.6.7,<2",
    "timesfm[torch]>=3.0.1",
    "pandas>=2.3",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.2",
    "scikit-learn>=1.9.0",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
cpu = ["torch>=2.14"]
gpu = ["torch>=2.14"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
weather-bootstrap = [
    { include-group = "weather-api" },
    "boto3>=1.40",
]
weather-ingest = [
    { include-group = "weather-api" },
    "pandas>=2.3",
    "requests>=2.32",
    "scikit-learn>=1.9.0",
]
weather-api = [
    "authlib>=1.6.7,<2",
    "requests>=2.32.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "prometheus-client>=0.26.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
