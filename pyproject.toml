[project]
name = "timesfm-serve"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "timesfm[torch]>=3.0.1",
    "pandas>=2.3",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "rq>=2",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.2",
    "authlib>=1.8.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.14"]
gpu = ["torch>=2.14"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "scikit-learn>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
