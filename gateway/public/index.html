<!doctype html>
<meta charset="utf-8" />
<title>timesfm-serve</title>
<style>
  body {
    font: 14px/1.5 system-ui, sans-serif;
    margin: 2rem auto;
    max-width: 960px;
    padding: 0 1rem;
    color: #222;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: .25rem; }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
  input, select, button { font: inherit; padding: .35rem .5rem; }
  input[type=password] { width: 22rem; }
  button { cursor: pointer; }
  svg { width: 100%; height: 360px; background: #fafafa; border: 1px solid #e5e5e5; }
  .muted { color: #777; font-size: .85rem; }
  .err { color: #b00; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 1rem; }
  td, th { padding: .2rem .7rem; text-align: right; border-bottom: 1px solid #eee; }
  td:first-child, th:first-child { text-align: left; }
</style>

<h1>daily peak demand, forecast ahead</h1>
<p class="muted">
  history is grid india daily peak met. the server fetches weather covariates itself from the
  selected provider and feeds them to timesfm 3. the band is p10 to p90.
</p>

<div class="row">
  <select id="state"></select>
  <select id="provider"></select>
  <label>horizon <input id="horizon" type="number" value="14" min="1" max="60" style="width:4rem" /></label>
  <input id="key" type="password" placeholder="api key" />
  <button id="go">forecast</button>
</div>
<p id="status" class="muted"></p>

<svg id="chart" viewBox="0 0 960 360" preserveAspectRatio="none"></svg>
<p class="muted" id="legend"></p>
<table id="table"></table>

<script>
  const $ = (s) => document.querySelector(s);
  const saved = localStorage.getItem("tfm_key");
  if (saved) $("#key").value = saved;
  let hist = null;

  Promise.all([
    fetch("/demo/states").then((r) => r.json()),
    fetch("/v1/weather/providers").then((r) => r.json()),
  ]).then(([states, providers]) => {
    for (const s of states) {
      const o = document.createElement("option");
      o.value = o.textContent = s.state;
      $("#state").append(o);
    }
    for (const p of providers.providers) {
      const o = document.createElement("option");
      o.value = o.textContent = p;
      o.selected = p === providers.default;
      $("#provider").append(o);
    }
    load();
  });

  $("#state").onchange = load;
  $("#go").onclick = run;

  async function load() {
    hist = await (
      await fetch(`/demo/history?state=${encodeURIComponent($("#state").value)}&days=120`)
    ).json();
    draw(hist, null);
  }

  async function run() {
    const key = $("#key").value.trim();
    localStorage.setItem("tfm_key", key);
    $("#status").className = "muted";
    $("#status").textContent = "fetching weather and forecasting...";

    const full = await (
      await fetch(`/demo/history?state=${encodeURIComponent($("#state").value)}&days=365`)
    ).json();

    const t0 = performance.now();
    const res = await fetch("/v1/forecast/weather", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key },
      body: JSON.stringify({
        series: full.demand,
        last_date: full.dates.at(-1),
        lat: full.lat,
        lon: full.lon,
        horizon: Number($("#horizon").value),
        provider: $("#provider").value,
      }),
    });

    const body = await res.json();
    if (!res.ok) {
      $("#status").className = "err";
      $("#status").textContent = `${res.status}: ${body.error ?? "request failed"}`;
      return;
    }
    $("#status").className = "muted";
    $("#status").textContent =
      `${body.model} via ${body.weather_provider}, ${Math.round(performance.now() - t0)} ms, ` +
      `charged ${body.credits_charged} credits, ${body.credits_remaining} left`;
    draw(hist, body);
  }

  function draw(h, fc) {
    const W = 960, H = 360, P = 40;
    const past = h.demand, n = past.length, m = fc ? fc.forecast.length : 0;
    const all = past.concat(fc ? fc.quantiles.flat() : []);
    const lo = Math.min(...all) * 0.97, hi = Math.max(...all) * 1.03;
    const x = (i) => P + (i / (n + m - 1)) * (W - 2 * P);
    const y = (v) => H - P - ((v - lo) / (hi - lo)) * (H - 2 * P);

    let s = "";
    for (let i = 0; i < 5; i++) {
      const v = lo + ((hi - lo) * i) / 4;
      s += `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/>`;
      s += `<text x="4" y="${y(v) + 4}" font-size="11" fill="#999">${Math.round(v)}</text>`;
    }
    s += `<polyline fill="none" stroke="#333" stroke-width="1.5" points="${past
      .map((v, i) => `${x(i)},${y(v)}`)
      .join(" ")}"/>`;

    if (fc) {
      const q = fc.quantiles;
      const band = (k) => Array.from({ length: m }, (_, i) => `${x(n + i)},${y(q[i][k])}`);
      s += `<polygon fill="#2a7de1" fill-opacity=".15" points="${band(0)
        .concat(band(8).reverse())
        .join(" ")}"/>`;
      s += `<polygon fill="#2a7de1" fill-opacity=".2" points="${band(2)
        .concat(band(6).reverse())
        .join(" ")}"/>`;
      s += `<polyline fill="none" stroke="#2a7de1" stroke-width="2" points="${[
        `${x(n - 1)},${y(past[n - 1])}`,
      ]
        .concat(fc.forecast.map((v, i) => `${x(n + i)},${y(v)}`))
        .join(" ")}"/>`;
      s += `<line x1="${x(n - 1)}" x2="${x(n - 1)}" y1="${P}" y2="${H - P}" stroke="#bbb" stroke-dasharray="4 3"/>`;

      $("#legend").textContent = `black: last ${n} days. blue: p50 with p30-p70 and p10-p90 bands.`;
      $("#table").innerHTML =
        "<tr><th>day</th><th>p10</th><th>p50</th><th>p90</th></tr>" +
        fc.forecast
          .map(
            (v, i) =>
              `<tr><td>+${i + 1}</td><td>${Math.round(q[i][0])}</td><td>${Math.round(
                v,
              )}</td><td>${Math.round(q[i][8])}</td></tr>`,
          )
          .join("");
    } else {
      $("#legend").textContent = `last ${n} days of ${h.state}. enter a key and press forecast.`;
      $("#table").innerHTML = "";
    }
    $("#chart").innerHTML = s;
  }
</script>
