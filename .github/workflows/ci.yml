name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfm
          POSTGRES_PASSWORD: tfm
          POSTGRES_DB: tfm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tfm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra cpu
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql://tfm:tfm@localhost:5432/tfm_test
      - name: Build lightweight weather API
        run: docker build -f deploy/Dockerfile.api -t weather-api-ci .
      - name: Boot weather API against PostgreSQL
        run: |
          docker run -d --name weather-api-ci --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL \
            --security-opt no-new-privileges \
            -e DATABASE_URL=postgresql://tfm:tfm@localhost:5432/tfm_test \
            -v "$PWD/results/weather/india_station_seasonal_v1/holdout/cases:/replays:ro" \
            weather-api-ci
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health/ready
          docker exec weather-api-ci python -c "import importlib.util, os; assert os.getuid() == 10001; assert importlib.util.find_spec('torch') is None"
      - name: Build and check lightweight weather ingestor
        run: |
          docker build -f deploy/Dockerfile.ingest -t weather-ingest-ci .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges weather-ingest-ci \
            python -c "import importlib.util, os; from scripts import weather_live_ingest; assert os.getuid() == 10001; assert importlib.util.find_spec('torch') is None"
      - name: Build and check credential/artifact bootstrap
        run: |
          docker build -f deploy/Dockerfile.bootstrap -t weather-bootstrap-ci .
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges weather-bootstrap-ci \
            python -c "import importlib.util, os; from scripts import weather_cloud_init, weather_db_admin; assert os.getuid() == 10001; assert importlib.util.find_spec('torch') is None"

  weather-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
      - run: terraform -chdir=infra/runtime init -backend=false -input=false
      - run: terraform -chdir=infra/runtime fmt -check -recursive
      - run: terraform -chdir=infra/runtime validate
      - run: terraform -chdir=infra/runtime test
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap fmt -check
      - run: terraform -chdir=infra/bootstrap validate
      - run: python -m scripts.weather_render --config deploy/example.json --output /tmp/weather-rendered --example
      - name: Validate Kubernetes schemas without a cluster
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform-linux-amd64.tar.gz
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS -o /tmp/kubeconform-CHECKSUMS
          cd /tmp
          grep ' kubeconform-linux-amd64.tar.gz$' kubeconform-CHECKSUMS | sha256sum --check --strict
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.35.0 weather-rendered "$GITHUB_WORKSPACE/deploy/nvidia-device-plugin.yaml"
