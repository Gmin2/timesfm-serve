name: ci
on: [push, pull_request]

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfm
          POSTGRES_PASSWORD: tfm
          POSTGRES_DB: tfm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tfm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://tfm:tfm@localhost:5432/tfm_test

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra cpu
      - run: uv run ruff check .
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    needs: [gateway, inference]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TORCH=cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
