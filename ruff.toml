line-length = 160
target-version = "py312"
exclude = ["tmp", ".venv"]

[lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[lint.flake8-bugbear]
# Depends() and Body() in argument defaults is how fastapi declares
# dependencies, so B008 is a false positive on every endpoint
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Header", "fastapi.Query"]
