name: pravah-weather-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfm
      POSTGRES_PASSWORD: tfm
      POSTGRES_DB: tfm
    ports: ["127.0.0.1:${WEATHER_DB_PORT:-15432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfm -d tfm"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports: ["127.0.0.1:${WEATHER_API_PORT:-18001}:8000"]
    environment:
      DATABASE_URL: postgresql://tfm:tfm@db:5432/tfm
      DATABASE_AUTO_MIGRATE: "1"
      WEATHER_METRICS_TOKEN: ${WEATHER_METRICS_TOKEN:-}
    volumes:
      - ./results/weather/india_station_seasonal_v1/holdout/cases:/replays:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
