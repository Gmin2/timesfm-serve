services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfm
      POSTGRES_PASSWORD: tfm
      POSTGRES_DB: tfm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfm"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    ports: ["8000:8000"]
    environment: &env
      DATABASE_URL: postgresql://tfm:tfm@db:5432/tfm
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SIGNUP_CREDITS: ${SIGNUP_CREDITS:-50000}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: .
    command: python -m timesfm_serve.worker
    environment: *env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
volumes:
  pgdata:
