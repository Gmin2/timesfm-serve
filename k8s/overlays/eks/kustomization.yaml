resources:
  - ../../base
images:
  - name: timesfm-serve
    newName: ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/timesfm-serve
    newTag: gpu
patches:
  - path: gpu.yaml
    target: { kind: Deployment, name: worker }
  - target: { kind: ScaledObject, name: worker }
    patch: |
      - op: replace
        path: /spec/maxReplicaCount
        value: 1
