apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: tfm
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: tfm }
            - { name: POSTGRES_DB, value: tfm }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: tfm-config, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "tfm"] }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tfm
spec:
  selector: { app: db }
  ports: [{ port: 5432 }]
