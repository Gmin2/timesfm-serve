# worker scales on queue depth. zero replicas when idle, one per 5 waiting jobs.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: tfm
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        address: redis.tfm.svc:6379
        listName: rq:queue:forecast
        listLength: "5"
        activationListLength: "0"
