apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tfm
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: timesfm-serve
          envFrom: [{ secretRef: { name: tfm-config } }]
          ports: [{ containerPort: 8000, name: http }]
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: "1", memory: 3Gi }
            limits: { memory: 6Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tfm
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: http }]
