# eksctl create cluster -f k8s/eks-cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: tfm
  region: us-east-1
  version: "1.33"

managedNodeGroups:
  - name: system
    instanceType: t3.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    labels: { workload: system }

  - name: gpu
    instanceType: g5.xlarge
    amiFamily: AmazonLinux2023
    spot: true
    desiredCapacity: 1
    minSize: 0
    maxSize: 2
    labels: { workload: gpu }
    taints:
      - { key: nvidia.com/gpu, value: "true", effect: NoSchedule }
    volumeSize: 80

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
